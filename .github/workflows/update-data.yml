name: Update CDC Data Weekly

on:
  schedule:
    - cron: "0 0 * * 6"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install system dependencies for sf
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev
      
      - name: Set up dependencies
        env:
          RSPM: ""
          R_REPOSITORIES: https://cloud.r-project.org
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          use-public-rspm: false
          packages: |
            any::readr
            any::dplyr
            any::sf
            any::shiny
            any::rsconnect
            any::rmarkdown
            any::shinyWidgets
            any::tidyverse
            any::cpp11
            any::progress

      - name: Fetch data
        run: Rscript data/fetch.R

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.rds
          git diff --staged --quiet || git commit -m "Update CDC data $(date -u +%Y-%m-%d)"
          git push

      - name: Deploy app to shinyapps.io
        env:
          SHINY_ACCOUNT: ${{ secrets.SHINY_ACCOUNT }}
          SHINY_TOKEN: ${{ secrets.SHINY_TOKEN }}
          SHINY_SECRET: ${{ secrets.SHINY_SECRET }}
          RSPM: ""
        run: |
          Rscript -e '
            # Force CRAN everywhere
            options(repos = c(CRAN="https://cloud.r-project.org"))
            Sys.setenv(RSPM = "")

            # Override rsconnect’s internal repo logic
            rsconnect::writeManifest(
              appDir = ".",
              appPrimaryDoc = NULL,
              appFiles = list.files(".", recursive = TRUE),
              appMode = "shiny",
              users = NULL,
              metadata = list(
                repo = "https://cloud.r-project.org"
              )
            )

            rsconnect::setAccountInfo(
              name = Sys.getenv("SHINY_ACCOUNT"),
              token = Sys.getenv("SHINY_TOKEN"),
              secret = Sys.getenv("SHINY_SECRET")
            )

            rsconnect::deployApp(
              appDir = ".",
              appName = "vrpwm-dashboard",
              forceUpdate = TRUE
            )
          '
